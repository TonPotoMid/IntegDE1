name: CI - pipeline data

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://pipeline:pipeline@localhost:5432/transactions
  S3_ENDPOINT: http://localhost:8333
  RETRY_DELAY: "0.2"

jobs:
  lint-unit:
    name: Lint + tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests unitaires
        run: pytest tests/unit -v

  pipeline:
    name: Pipeline S3 -> traitement -> PostgreSQL + tests d'intégration
    needs: lint-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: 1. Démarrage du S3 local (SeaweedFS) et de PostgreSQL
        run: docker compose up -d --wait db s3

      - name: 2. Génération des CSV
        run: python -m pipeline.main generate --output data

      - name: 3. Upload des CSV dans le S3
        run: python -m pipeline.main upload --input data

      - name: 4. Setup de la base de données
        run: python -m pipeline.main init-db

      - name: 5. Traitement + insertion (avec un bug d'insertion simulé -> retry)
        env:
          SIMULATE_INSERT_FAILURES: "2"
          SIMULATE_DOWNLOAD_FAILURES: "1"
        run: python -m pipeline.main process

      - name: 6. Test d'intégration de l'état de la base
        run: pytest tests/integration/test_db_state.py -v

      - name: 7. Relance du traitement (idempotence - aucun fichier retraité)
        run: |
          python -m pipeline.main process 2>&1 | tee rerun.log
          grep -q "'processed': 0, 'skipped': 3" rerun.log
          pytest tests/integration/test_db_state.py -q

      - name: 8. Tests d'intégration bout-en-bout (retry, idempotence, incrémental)
        run: pytest tests/integration/test_pipeline.py -v

      - name: Logs des services
        if: failure()
        run: docker compose logs --tail 200
